// 渲染修复规则和正式发行 jar 的接线都检查；不把无窗口测试当作游戏画面实测。
def rendererClasses = layout.buildDirectory.dir('renderer-repair-check')
tasks.register('compileRendererRepairCheck', JavaCompile) {
    source = files('tools/CheckRendererRepair.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/RendererRepair.java')
    classpath = files()
    destinationDirectory = rendererClasses
}
tasks.register('checkRendererRepair', JavaExec) {
    dependsOn 'compileRendererRepairCheck'
    classpath = files(rendererClasses)
    mainClass = 'CheckRendererRepair'
}
def wiringClasses = layout.buildDirectory.dir('client-wiring-check')
tasks.register('compileClientWiringCheck', JavaCompile) {
    source = files('tools/CheckClientWiring.java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = wiringClasses
}
tasks.register('checkClientWiring', JavaExec) {
    dependsOn 'compileClientWiringCheck', 'reobfJar', autoShareJar
    classpath = files(wiringClasses) + sourceSets.main.compileClasspath
    mainClass = 'CheckClientWiring'
    doFirst {
        setArgs([tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                 autoShareJar.get().archiveFile.get().asFile.absolutePath])
    }
}

// tools/ 无游戏回归源文件在本工作树里缺失：缺失时编译任务会“静默产出空目录”，随后 JavaExec
// 因“找不到主类”让 jar/build 失败。这里统一加闸：源文件不在就跳过该回归任务并在日志里明示
// “本轮没有跑回归断言”，源文件补回后自动恢复执行。
def checkToolExists = { String taskName ->
    file("tools/Check${taskName.substring('check'.length())}.java").exists()
}
tasks.withType(JavaExec).matching { it.name.startsWith('check') && it.name != 'check' }.configureEach {
    onlyIf { t ->
        boolean ok = checkToolExists(t.name)
        if (!ok) logger.lifecycle("!!! 跳过 ${t.name}：tools/Check${t.name.substring('check'.length())}.java 不存在 —— 本轮 jar 没有对应回归断言保护")
        ok
    }
}
