def motionClasses = layout.buildDirectory.dir('melee-motion-check')
tasks.register('compileMeleeMotionCheck', JavaCompile) {
    source = files('tools/CheckMeleeMotion.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/HeldInput.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/MeleeComboRules.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/MeleeViewRules.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/DismantlePose.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/DismantleMotionRules.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/SlashFormRules.java')
    classpath = files()
    destinationDirectory = motionClasses
