modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AutoMods"
description='''吞噬宿傩记忆开启术式，探索神庙挑战咒胎戴天，集齐20根手指，挑战5000血两阶段即身佛，觉醒空间斩与飞行。完成九相试炼、吞噬九相图、积累残秽。新增十字斩、蜘蛛网、多重斩与密度可调的墙；里梅记忆解锁冰凝咒法，冰鱼永久成长。N轮盘、R释放与蓄力、J任务、V九相轮转。需要 Photon 1.1.17。'''
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="photon"
mandatory=true
versionRange="[1.1.17]"
ordering="AFTER"
side="CLIENT"
[[dependencies.${mod_id}]]
modId="playeranimator"
    mandatory=false
    versionRange="[1.0.2-rc1,)"
    side="BOTH"
    ordering="AFTER"

[[dependencies.${mod_id}]]
modId="touhou_little_maid"
mandatory=false
versionRange="[1.2.5,)"
ordering="AFTER"
side="BOTH"

# 苍/赫/茈 的**彩色光照**前置：Colorful Lighting（客户端 mod，1.20.1 Forge）。
# 不装不影响任何玩法——只少掉"光真的照亮周围"这一层（退回模组自绘的发光壳）。
# 装了之后我们放的 sukuna:blue_light / red_light / purple_light 会被它按
# assets/sukuna/light/emitters.json 上色，走原版光照引擎传播，跟 Oculus 光影也兼容。
[[dependencies.${mod_id}]]
modId="colorful_lighting"
mandatory=false
versionRange="[2.0,)"
ordering="AFTER"
side="CLIENT"
