def authorityClasses = layout.buildDirectory.dir('authority-multiplayer-check')
tasks.register('compileAuthorityMultiplayerCheck', JavaCompile) {
    source = files('tools/CheckAuthorityMultiplayer.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/AuthorityRules.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/BeyondProgressRules.java')
    classpath = files()
    destinationDirectory = authorityClasses
}
tasks.register('checkAuthorityMultiplayer', JavaExec) {
    dependsOn 'compileAuthorityMultiplayerCheck'
    classpath = files(authorityClasses)
    mainClass = 'CheckAuthorityMultiplayer'
