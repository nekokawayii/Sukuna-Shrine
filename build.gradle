def terrainClasses = layout.buildDirectory.dir('slash-terrain-check')
tasks.register('compileSlashTerrainCheck', JavaCompile) {
    source = files('tools/CheckSlashTerrain.java',
        'src/main/java/cn/blockforge/generated/nnnnr1201forge2/SlashSweepRules.java')
    classpath = files()
    destinationDirectory = terrainClasses
}
tasks.register('checkSlashTerrain', JavaExec) {
    dependsOn 'compileSlashTerrainCheck'
    classpath = files(terrainClasses)
    mainClass = 'CheckSlashTerrain'
